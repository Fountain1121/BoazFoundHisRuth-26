<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boaz &amp; Ruth — Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>

<section id="hero">
  <div class="eyebrow">Boaz &amp; Ruth are getting married</div>
  <h1><span id="n1">Boaz</span> <em>&amp;</em> <span id="n2">Ruth</span></h1>
  <div class="stage" id="stage"><div class="tilt" id="tilt">
    <div class="l-back" id="ib"></div><div class="l-main" id="im"></div><div class="l-frame"></div><div class="l-glare"></div>
  </div></div>
  <div class="hint">MOVE, DRAG OR TILT YOUR PHONE</div>
  <div class="count" id="count"></div>
  <button class="btn" onclick="document.getElementById('inv').scrollIntoView()">Open Invitation</button>
</section>

<section id="inv">
  <div class="eyebrow">You are invited</div>
  <div class="tabs"><button class="btn" id="t1">Invitation</button><button class="btn ghost" id="t2">Save the Date</button></div>
  <div class="flip" id="flip"><div class="fin">
    <div class="face front">
      <div class="eyebrow">Wedding Celebration</div>
      <h2><span class="n1"></span> &amp; <span class="n2"></span></h2>
      <p id="msg"></p>
      <div class="d" id="dt"></div>
      <p id="tm"></p><p id="vn"></p><p class="eg" id="eg"></p><p class="d" id="ht" style="font-size:.95rem">#BoazFoundHisRuth ’26</p>
    </div>
    <div class="face back" id="fly"><i>Save the Date</i></div>
  </div></div>
  <div class="hint">TAP THE CARD TO FLIP</div>
</section>

<section id="col">
  <div class="eyebrow">Wedding Colors</div>
  <h2 style="font-size:2.4rem">Dress in our palette</h2>
  <div class="sw" id="sw"></div>
  <p class="rsvp" id="dress"></p>
</section>

<section id="map">
  <div class="eyebrow">Getting there</div>
  <h2 style="font-size:2.4rem">Find the venues</h2>
  <div class="tabs" role="group" aria-label="Choose event"><button class="btn" id="vt-engagement" type="button" aria-pressed="true">Engagement</button><button class="btn ghost" id="vt-wedding" type="button" aria-pressed="false">Wedding</button></div>
  <p class="rsvp"><b id="mv"></b><br><span id="ma"></span></p>
  <div class="mapbox"><iframe id="mf" title="Wedding venue map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
  <div class="links" id="ml">
    <a class="btn" id="l-g" target="_blank" rel="noopener">Google Maps</a>
    <a class="btn" id="l-a" target="_blank" rel="noopener">Apple Maps</a>
    <a class="btn" id="l-w" target="_blank" rel="noopener">Waze</a>
    <a class="btn" id="l-u" target="_blank" rel="noopener">Request an Uber</a>
    <button class="btn ghost" id="l-c" type="button">Copy address for Bolt / Yango</button>
  </div>
  <div class="hint" id="cp" role="status"></div>
</section>
